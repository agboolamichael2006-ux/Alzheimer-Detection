<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="icon"
          href="{{ url_for('static', filename='brain.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/profile.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="profile-card">

        <div class="header">

            <h1>My Profile</h1>

            <p>
                Update your account information below.
            </p>

        </div>

        <form method="POST">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="fullname"
                    value="{{ user['fullname'] }}"
                    required>

            </div>

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    value="{{ user['username'] }}"
                    readonly>

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    value="{{ user['email'] }}"
                    required>

            </div>

            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    value="{{ user['phone'] }}"
                    placeholder="Enter Phone Number">

            </div>

            <div class="form-group">

                <label>Address</label>

                <textarea
                    name="address"
                    placeholder="Enter Address">{{ user['address'] }}</textarea>

            </div>

            <button type="submit">

                Save Changes

            </button>

        </form>

        <div class="buttons">

            <a href="{{ url_for('dashboard') }}" class="btn">

                Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
